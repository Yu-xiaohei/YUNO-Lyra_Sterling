<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FFA502">
  <meta name="description" content="日本机票价格记录与航班方案对比">
  <link rel="icon" href="./assets/YUNO-Lyra_Sterling-logo.svg?v=8" type="image/svg+xml">
  <title>于の旅行侦探 YUNO Lyra Sterling</title>
  <link rel="stylesheet" href="./styles.css?v=20261103-6">
  <script src="./assets/vendor/gsap.min.js" defer></script>
  <script src="./assets/vendor/lucide.min.js" defer></script>
  <script src="./app.js?v=20261103-6" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./" aria-label="于の旅行侦探 YUNO Lyra Sterling 首页">
      <img class="brand-mark" src="./assets/YUNO-Lyra_Sterling-logo.svg?v=8" width="44" height="44" alt="">
      <span>于の旅行侦探<span class="brand-en">YUNO Lyra Sterling</span></span>
    </a>
    <div class="topbar-right">
      <span class="source-label">Skyscanner 价格记录</span>
      <button class="icon-button" id="theme-toggle" title="切换深色模式" aria-label="切换深色模式"><i data-lucide="moon"></i></button>
    </div>
  </header>
  <main class="shell">
    <div class="page-heading">
      <div><div class="eyebrow">CHINA / 中国 · JAPAN / 日本</div><h1>机票价格监控</h1></div>
      <div class="updated"><span class="status-dot"></span><span id="updated">正在读取数据</span></div>
    </div>
    <nav class="task-nav" aria-label="盯价任务">
      <div class="tabs" role="tablist" aria-label="选择行程" id="task-tabs"></div>
    </nav>
    <div id="live-status" class="sr-only" role="status" aria-live="polite"></div>
    <section id="task-panel" role="tabpanel" tabindex="0">
      <div class="loading-state">正在整理航班记录…</div>
    </section>
    <footer>
      <span><i data-lucide="shield-check"></i>至少含 1 件托运行李 · 已排除春秋航空</span>
      <span>价格随时变动，仅供走势参考</span>
    </footer>
  </main>
  <noscript>请启用 JavaScript 以查看航班和价格图表。</noscript>
</body>
</html>
